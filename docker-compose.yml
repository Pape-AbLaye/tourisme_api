services:
  postgres:
    container_name: postgres-sql-tourism
    image: postgres:16
    environment:
      POSTGRES_USER: abdoulaye

      POSTGRES_PASSWORD: password
      POSTGRES_DB: tourism
    volumes:
      - postgres_tourism:/var/lib/postgresql/data
    networks:
      - tourism
    restart: unless-stopped
    ports:
      - 5432:5432

  pgadmin:
    container_name: pgadmin-tourism
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin
    networks:
      - tourism
    ports:
      - "8085:80"
    depends_on:
      - postgres

  mail-dev:
    container_name: mail-dev-tourism
    image: maildev/maildev
    ports:
      - 1080:1080
      - 1025:1025
    networks:
      - tourism

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka_tourism
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    networks:
      - tourism

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper_tourism
    environment:
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - 22181:2181
    networks:
      - tourism

  keycloak:
    container_name: keycloak-tourism
    image: quay.io/keycloak/keycloak:latest
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    networks:
      - tourism
    command: ["start-dev"]
    ports:
      - 9091:8080

networks:
  tourism:
    driver : bridge

volumes:
  postgres_tourism:
    driver: local