services:
  postgres:
    container_name: postgres-sql-tourism
    image: postgres:16
    environment:
      POSTGRES_USER: abdoulaye

      POSTGRES_PASSWORD: password
      POSTGRES_DB: tourism
    volumes:
      - postgres_tourism:/var/lib/postgresql/data
    networks:
      - tourism
    restart: unless-stopped
    ports:
      - 5432:5432

  pgadmin:
    container_name: pgadmin-tourism
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin
    networks:
      - tourism
    ports:
      - "8085:80"
    depends_on:
      - postgres

  keycloak:
    container_name: keycloak-tourism
    image: quay.io/keycloak/keycloak:latest
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    networks:
      - tourism
    command: ["start-dev"]
    ports:
      - 9091:8080

networks:
  tourism:
    driver : bridge

volumes:
  postgres_tourism:
    driver: local